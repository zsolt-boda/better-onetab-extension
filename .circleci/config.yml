# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference

version: 2.1

# Define pipeline parameters to receive Vercel webhook payload data
# Based on: https://vercel.com/docs/webhooks/webhooks-api#deployment.succeeded
parameters:
  # Top-level webhook fields
  webhook-id:
    type: string
    default: ""
  event-type:
    type: string
    default: "deployment.succeeded"
  created-at:
    type: integer
    default: 0
  region:
    type: string
    default: ""
  
  # Deployment payload fields
  deployment-id:
    type: string
    default: ""
  deployment-url:
    type: string
    default: ""
  deployment-name:
    type: string
    default: ""
  deployment-state:
    type: string
    default: ""
  deployment-target:
    type: string
    default: ""
  deployment-type:
    type: string
    default: ""
  deployment-created-at:
    type: integer
    default: 0
  deployment-ready:
    type: integer
    default: 0
  
  # Project information
  project-id:
    type: string
    default: ""
  project-name:
    type: string
    default: ""
  
  # User/Team information
  user-id:
    type: string
    default: ""
  user-username:
    type: string
    default: ""
  team-id:
    type: string
    default: ""
  team-slug:
    type: string
    default: ""
  
  # Links and metadata
  deployment-links-deployment:
    type: string
    default: ""
  deployment-links-project:
    type: string
    default: ""
  
  # Git information
  deployment-meta-git-commit-sha:
    type: string
    default: ""
  deployment-meta-git-commit-message:
    type: string
    default: ""
  deployment-meta-git-commit-author:
    type: string
    default: ""
  deployment-meta-git-commit-ref:
    type: string
    default: ""
  deployment-meta-git-repo-id:
    type: string
    default: ""
  deployment-meta-git-repo-owner:
    type: string
    default: ""
  deployment-meta-git-repo-slug:
    type: string
    default: ""
  
  # Full payload as JSON string (for complete data)
  full-payload:
    type: string
    default: "{}"

# Define a job to display the Vercel webhook payload
jobs:
  display-vercel-deployment:
    docker:
      - image: cimg/base:current

    steps:
      - checkout
      
      - run:
          name: "Display Vercel Webhook Event Information"
          command: |
            echo "=========================================="
            echo "VERCEL WEBHOOK EVENT"
            echo "=========================================="
            echo ""
            echo "Event ID: << pipeline.parameters.webhook-id >>"
            echo "Event Type: << pipeline.parameters.event-type >>"
            echo "Created At: << pipeline.parameters.created-at >>"
            echo "Region: << pipeline.parameters.region >>"
            echo ""
            echo "=========================================="
      
      - run:
          name: "Display Deployment Information"
          command: |
            echo "=========================================="
            echo "DEPLOYMENT DETAILS"
            echo "=========================================="
            echo ""
            echo "Deployment ID: << pipeline.parameters.deployment-id >>"
            echo "Deployment URL: << pipeline.parameters.deployment-url >>"
            echo "Deployment Name: << pipeline.parameters.deployment-name >>"
            echo "State: << pipeline.parameters.deployment-state >>"
            echo "Target: << pipeline.parameters.deployment-target >>"
            echo "Type: << pipeline.parameters.deployment-type >>"
            echo "Created At: << pipeline.parameters.deployment-created-at >>"
            echo "Ready At: << pipeline.parameters.deployment-ready >>"
            echo ""
            echo "=========================================="
      
      - run:
          name: "Display Project Information"
          command: |
            echo "=========================================="
            echo "PROJECT DETAILS"
            echo "=========================================="
            echo ""
            echo "Project ID: << pipeline.parameters.project-id >>"
            echo "Project Name: << pipeline.parameters.project-name >>"
            echo ""
            echo "=========================================="
      
      - run:
          name: "Display Git Information"
          command: |
            echo "=========================================="
            echo "GIT INFORMATION"
            echo "=========================================="
            echo ""
            echo "Commit SHA: << pipeline.parameters.deployment-meta-git-commit-sha >>"
            echo "Commit Message: << pipeline.parameters.deployment-meta-git-commit-message >>"
            echo "Commit Author: << pipeline.parameters.deployment-meta-git-commit-author >>"
            echo "Commit Ref: << pipeline.parameters.deployment-meta-git-commit-ref >>"
            echo ""
            echo "Repository:"
            echo "  - ID: << pipeline.parameters.deployment-meta-git-repo-id >>"
            echo "  - Owner: << pipeline.parameters.deployment-meta-git-repo-owner >>"
            echo "  - Slug: << pipeline.parameters.deployment-meta-git-repo-slug >>"
            echo ""
            echo "=========================================="
      
      - run:
          name: "Display User/Team Information"
          command: |
            echo "=========================================="
            echo "USER/TEAM DETAILS"
            echo "=========================================="
            echo ""
            echo "User ID: << pipeline.parameters.user-id >>"
            echo "Username: << pipeline.parameters.user-username >>"
            echo ""
            echo "Team ID: << pipeline.parameters.team-id >>"
            echo "Team Slug: << pipeline.parameters.team-slug >>"
            echo ""
            echo "=========================================="
      
      - run:
          name: "Display Links"
          command: |
            echo "=========================================="
            echo "LINKS"
            echo "=========================================="
            echo ""
            echo "Deployment Link: << pipeline.parameters.deployment-links-deployment >>"
            echo "Project Link: << pipeline.parameters.deployment-links-project >>"
            echo ""
            echo "=========================================="
      
      - run:
          name: "Display Full Payload (JSON)"
          command: |
            echo "=========================================="
            echo "FULL WEBHOOK PAYLOAD"
            echo "=========================================="
            echo ""
            echo '<< pipeline.parameters.full-payload >>' | jq '.' || echo '<< pipeline.parameters.full-payload >>'
            echo ""
            echo "=========================================="
      
      - run:
          name: "Display Pipeline Metadata"
          command: |
            echo "=========================================="
            echo "CIRCLECI PIPELINE METADATA"
            echo "=========================================="
            echo ""
            echo "Pipeline ID: << pipeline.id >>"
            echo "Pipeline Number: << pipeline.number >>"
            echo "Triggered By: << pipeline.trigger_source >>"
            echo ""
            echo "=========================================="

# Orchestrate jobs using workflows
workflows:
  vercel-webhook-handler:
    jobs:
      - display-vercel-deployment
