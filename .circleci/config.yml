# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference

version: 2.1

# Define a job to display the Vercel webhook payload
jobs:
  display-vercel-webhook:
    # Specify the execution environment
    docker:
      - image: cimg/base:current

    # Add steps to the job
    steps:
      - checkout
      
      - run:
          name: "Display Raw Webhook Body"
          command: |
            echo "=========================================="
            echo "RAW WEBHOOK BODY"
            echo "=========================================="
            echo '<< pipeline.trigger_parameters.webhook.body >>'
            echo ""
            echo "=========================================="
      
      - run:
          name: "Display Formatted Webhook Payload"
          command: |
            echo "=========================================="
            echo "FORMATTED WEBHOOK PAYLOAD (JSON)"
            echo "=========================================="
            echo '<< pipeline.trigger_parameters.webhook.body >>' | jq '.'
            echo ""
            echo "=========================================="
      
      - run:
          name: "Extract Vercel Event Details"
          command: |
            echo "=========================================="
            echo "VERCEL EVENT DETAILS"
            echo "=========================================="
            
            WEBHOOK_BODY='<< pipeline.trigger_parameters.webhook.body >>'
            
            EVENT_ID=$(echo "$WEBHOOK_BODY" | jq -r '.id // "N/A"')
            EVENT_TYPE=$(echo "$WEBHOOK_BODY" | jq -r '.type // "N/A"')
            CREATED_AT=$(echo "$WEBHOOK_BODY" | jq -r '.createdAt // "N/A"')
            REGION=$(echo "$WEBHOOK_BODY" | jq -r '.region // "N/A"')
            
            echo "Event ID: $EVENT_ID"
            echo "Event Type: $EVENT_TYPE"
            echo "Created At: $CREATED_AT"
            echo "Region: $REGION"
            echo ""
            echo "=========================================="
      
      - run:
          name: "Extract Deployment Information"
          command: |
            echo "=========================================="
            echo "DEPLOYMENT INFORMATION"
            echo "=========================================="
            
            WEBHOOK_BODY='<< pipeline.trigger_parameters.webhook.body >>'
            
            DEPLOYMENT_ID=$(echo "$WEBHOOK_BODY" | jq -r '.payload.deployment.id // "N/A"')
            DEPLOYMENT_URL=$(echo "$WEBHOOK_BODY" | jq -r '.payload.deployment.url // "N/A"')
            DEPLOYMENT_NAME=$(echo "$WEBHOOK_BODY" | jq -r '.payload.deployment.name // "N/A"')
            DEPLOYMENT_STATE=$(echo "$WEBHOOK_BODY" | jq -r '.payload.deployment.state // "N/A"')
            DEPLOYMENT_TARGET=$(echo "$WEBHOOK_BODY" | jq -r '.payload.deployment.target // "N/A"')
            DEPLOYMENT_TYPE=$(echo "$WEBHOOK_BODY" | jq -r '.payload.deployment.type // "N/A"')
            
            echo "Deployment ID: $DEPLOYMENT_ID"
            echo "Deployment URL: https://$DEPLOYMENT_URL"
            echo "Deployment Name: $DEPLOYMENT_NAME"
            echo "State: $DEPLOYMENT_STATE"
            echo "Target: $DEPLOYMENT_TARGET"
            echo "Type: $DEPLOYMENT_TYPE"
            echo ""
            echo "=========================================="
      
      - run:
          name: "Extract Project Information"
          command: |
            echo "=========================================="
            echo "PROJECT INFORMATION"
            echo "=========================================="
            
            WEBHOOK_BODY='<< pipeline.trigger_parameters.webhook.body >>'
            
            PROJECT_ID=$(echo "$WEBHOOK_BODY" | jq -r '.payload.project.id // "N/A"')
            PROJECT_NAME=$(echo "$WEBHOOK_BODY" | jq -r '.payload.project.name // "N/A"')
            
            echo "Project ID: $PROJECT_ID"
            echo "Project Name: $PROJECT_NAME"
            echo ""
            echo "=========================================="
      
      - run:
          name: "Extract Git Information"
          command: |
            echo "=========================================="
            echo "GIT INFORMATION"
            echo "=========================================="
            
            WEBHOOK_BODY='<< pipeline.trigger_parameters.webhook.body >>'
            
            COMMIT_SHA=$(echo "$WEBHOOK_BODY" | jq -r '.payload.deployment.meta.githubCommitSha // .payload.deployment.meta.gitlabCommitSha // .payload.deployment.meta.bitbucketCommitSha // "N/A"')
            COMMIT_MESSAGE=$(echo "$WEBHOOK_BODY" | jq -r '.payload.deployment.meta.githubCommitMessage // .payload.deployment.meta.gitlabCommitMessage // .payload.deployment.meta.bitbucketCommitMessage // "N/A"')
            COMMIT_AUTHOR=$(echo "$WEBHOOK_BODY" | jq -r '.payload.deployment.meta.githubCommitAuthorName // .payload.deployment.meta.gitlabCommitAuthorName // .payload.deployment.meta.bitbucketCommitAuthorName // "N/A"')
            COMMIT_REF=$(echo "$WEBHOOK_BODY" | jq -r '.payload.deployment.meta.githubCommitRef // .payload.deployment.meta.gitlabCommitRef // .payload.deployment.meta.bitbucketCommitRef // "N/A"')
            REPO_OWNER=$(echo "$WEBHOOK_BODY" | jq -r '.payload.deployment.meta.githubCommitOrg // .payload.deployment.meta.gitlabProjectNamespace // .payload.deployment.meta.bitbucketRepoOwner // "N/A"')
            REPO_NAME=$(echo "$WEBHOOK_BODY" | jq -r '.payload.deployment.meta.githubCommitRepo // .payload.deployment.meta.gitlabProjectName // .payload.deployment.meta.bitbucketRepoSlug // "N/A"')
            
            echo "Commit SHA: $COMMIT_SHA"
            echo "Commit Message: $COMMIT_MESSAGE"
            echo "Commit Author: $COMMIT_AUTHOR"
            echo "Commit Ref: $COMMIT_REF"
            echo ""
            echo "Repository:"
            echo "  - Owner: $REPO_OWNER"
            echo "  - Name: $REPO_NAME"
            echo ""
            echo "=========================================="
      
      - run:
          name: "Extract User/Team Information"
          command: |
            echo "=========================================="
            echo "USER/TEAM INFORMATION"
            echo "=========================================="
            
            WEBHOOK_BODY='<< pipeline.trigger_parameters.webhook.body >>'
            
            USER_ID=$(echo "$WEBHOOK_BODY" | jq -r '.payload.user.id // "N/A"')
            USERNAME=$(echo "$WEBHOOK_BODY" | jq -r '.payload.user.username // "N/A"')
            TEAM_ID=$(echo "$WEBHOOK_BODY" | jq -r '.payload.team.id // "N/A"')
            TEAM_SLUG=$(echo "$WEBHOOK_BODY" | jq -r '.payload.team.slug // "N/A"')
            
            echo "User ID: $USER_ID"
            echo "Username: $USERNAME"
            echo ""
            echo "Team ID: $TEAM_ID"
            echo "Team Slug: $TEAM_SLUG"
            echo ""
            echo "=========================================="
      
      - run:
          name: "Display Pipeline Metadata"
          command: |
            echo "=========================================="
            echo "CIRCLECI PIPELINE METADATA"
            echo "=========================================="
            echo ""
            echo "Pipeline ID: << pipeline.id >>"
            echo "Pipeline Number: << pipeline.number >>"
            echo "Trigger Source: << pipeline.trigger_source >>"
            echo "Git Branch: << pipeline.git.branch >>"
            echo ""
            echo "=========================================="

# Orchestrate jobs using workflows
workflows:
  vercel-deployment-webhook:
    jobs:
      - display-vercel-webhook
